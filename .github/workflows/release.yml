name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          # Un único .dmg universal (Apple Silicon e Intel): así nadie baja
          # el de la otra arquitectura y macOS no pide instalar Rosetta.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de las actualizaciones (clave generada con `tauri signer generate`)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Claude Interface v__VERSION__"
          releaseBody: |
            Instaladores de Claude Interface. Requiere tener instalado y autenticado Claude Code (`claude`).

            - **Linux:** `.rpm` (Fedora), `.deb` (Ubuntu/Debian) o `.AppImage`
            - **Windows:** `.msi` o `-setup.exe`
            - **macOS:** `universal.dmg` (Apple Silicon e Intel). La app no está firmada: tras copiarla a Aplicaciones ejecuta `xattr -cr "/Applications/Claude Interface.app"`.

            Si Claude Code no está instalado o no has iniciado sesión, la app lo instala y te guía al abrirla.

            Las versiones instaladas se actualizan desde la propia app.
          # Publicado directamente: el updater solo ve el último release publicado.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # Copias con nombre fijo para que el README enlace siempre a la última
  # versión vía releases/latest/download/<nombre>.
  stable-names:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Subir instaladores con nombre fijo
        run: |
          set -euo pipefail
          mkdir dist && cd dist
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p '*_x64-setup.exe' -p '*_x64_en-US.msi' -p '*_universal.dmg' \
            -p '*_amd64.AppImage' -p '*_amd64.deb' -p '*.x86_64.rpm'
          mv *_x64-setup.exe   Claude-Interface-windows-x64-setup.exe
          mv *_x64_en-US.msi   Claude-Interface-windows-x64.msi
          mv *_universal.dmg   Claude-Interface-macos-universal.dmg
          # Nombres anteriores, para que no se rompan enlaces ya compartidos.
          cp Claude-Interface-macos-universal.dmg Claude-Interface-macos-arm64.dmg
          cp Claude-Interface-macos-universal.dmg Claude-Interface-macos-x64.dmg
          mv *_amd64.AppImage  Claude-Interface-linux-x86_64.AppImage
          mv *_amd64.deb       Claude-Interface-linux-x86_64.deb
          mv *.x86_64.rpm      Claude-Interface-linux-x86_64.rpm
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber Claude-Interface-*

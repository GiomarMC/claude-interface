<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Interface</title>
    <style>html,body{background:#141413;margin:0}</style>
    <script>
      // En desarrollo, los errores de la página salen en la terminal de `pnpm tauri dev`.
      if (location.port === "1420") {
        const report = (m) => window.__TAURI_INTERNALS__?.invoke("log_js_error", { message: String(m) });
        addEventListener("error", (e) => report(`${e.message} @ ${e.filename}:${e.lineno}:${e.colno}\n${e.error?.stack ?? ""}`));
        addEventListener("unhandledrejection", (e) => report(e.reason?.stack ?? e.reason));
        const original = console.error;
        console.error = (...args) => {
          report(args.map((a) => a?.stack ?? (typeof a === "object" ? JSON.stringify(a) : a)).join(" "));
          original(...args);
        };
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
